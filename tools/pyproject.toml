[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lkbench"
version = "0.1.0"
description = "Helpers (test functions, designs, metrics, checks) for the libKriging benchmark notebooks"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas", "matplotlib", "jinja2"]  # jinja2: DataFrame.style

[project.optional-dependencies]
# the comparison packages (scikit-learn, SMT, OpenTURNS, GPy, ...) are installed by the
# notebooks that use them, not here
notebooks = ["nbclient", "nbformat", "ipykernel"]

[tool.setuptools]
packages = ["lkbench"]
